services:
  sstp_vpn:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    init: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      # pppd включает на tty дисциплину N_PPP (модуль ppp_async). В ядре WSL2
      # это модуль, и без SYS_MODULE ядро не подгрузит его: "Couldn't set tty
      # to PPP discipline: Operation not permitted"
      - SYS_MODULE
    devices:
      - /dev/ppp
    sysctls:
      # IPv6 не идёт через туннель, поэтому отключаем, чтобы не было утечек
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "80:443"
    volumes:
      - ./logs/vpn:/var/log/vpn
      - ./logs/squid:/var/log/squid
      - ./src/squid.conf:/etc/squid/squid.conf
